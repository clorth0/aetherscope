name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Run tests (hardware-free, synthetic)
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "=== $f ==="
            uv run python "$f" || fail=1
          done
          exit "$fail"

      - name: Check frontend JS syntax
        run: |
          fail=0
          for f in frontend/static/*.js; do
            echo "=== $f ==="
            node --check "$f" || fail=1
          done
          exit "$fail"
